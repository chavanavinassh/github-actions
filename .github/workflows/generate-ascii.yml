
name: Generate ASCII With Shell Script

on: push

jobs:

  ascii_job:
    name: ASCII Value Generate Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        
      - name: List Repo Files
        run: ls -ltra     

      - name: Execute Shell Script 
        run: |
          chmod +x ascii-script.sh
          ./ascii-script.sh
