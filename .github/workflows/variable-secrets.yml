name: Exploring Variables and Secrets

on: 
  push
env:
  CONTAINER_REGISTRY: docker.io
  DOCKER_USERNAME: siddharth1
  IMAGE_NAME: github-actions-nginx  

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/${{ vars.IMAGE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Build
        run: docker build -t $REGISTRY/$IMAGE_NAME:latest .

      - name: Docker Login
        env:
          DOCKER_PASSWORD: HelloMonte@9970
        run: echo "$DOCKER_PASSWORD" | docker login $REGISTRY -u "${{ vars.DOCKER_USERNAME }}" --password-stdin

      - name: Docker Publish
        run: docker push $REGISTRY/$IMAGE_NAME:latest
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Check Variables
        run: |
          echo "Registry: ${{ vars.CONTAINER_REGISTRY }}"
          echo "Username: ${{ vars.DOCKER_USERNAME }}"
          echo "Image: ${{ vars.IMAGE_NAME }}"
          echo "Full tag: ${{ vars.CONTAINER_REGISTRY }}/${{ vars.DOCKER_USERNAME }}/${{ vars.IMAGE_NAME }}:latest"
