name: Exploring Variables and Secrets

on:
  push

env:
  CONTAINER_REGISTRY: ghcr.io
  DOCKER_USERNAME: ${{ github.repository_owner }}
  IMAGE_NAME: test-hello-world

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Public Image & Tag It
        run: |
          docker pull hello-world:latest
          docker tag hello-world:latest $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest

      - name: Docker Login
        env:
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$DOCKER_PASSWORD" | docker login $CONTAINER_REGISTRY -u "$DOCKER_USERNAME" --password-stdin

      - name: Docker Publish
        run: docker push $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Check Variables & Run Test Image
        run: |
          echo "Registry: $CONTAINER_REGISTRY"
          echo "Username: $DOCKER_USERNAME"
          echo "Image: $IMAGE_NAME"
          docker run --rm $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest
